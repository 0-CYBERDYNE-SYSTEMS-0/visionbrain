<svg viewBox="0 0 1120 420" role="img" aria-labelledby="p2-fleet-title" aria-label="Measured plan view of a site drawn to scale: three aircraft with coverage circles of radius 75 metres, the two overlap lenses drawn and dimensioned, a person tracked along a roof route that stays inside at least one coverage circle at every step, and a single alert stream.">
        <title id="p2-fleet-title">Drone fleet plan view, three aircraft, measured coverage overlaps</title>

        <!-- site footprint -->
        <rect x="56" y="40" width="1008" height="300" fill="none" stroke="#101820" stroke-width="1.5" stroke-dasharray="7 6"/>
        <text x="56" y="28" class="svg-mono">site boundary · fence line · 504 m × 150 m</text>

        <!-- building, drawn before the lenses so the lens outlines read over it -->
        <rect x="310" y="170" width="420" height="150" fill="#e4e9ec" stroke="#101820" stroke-width="2"/>
        <g stroke="#5b6570" stroke-width="1">
          <line x1="328" y1="180" x2="358" y2="180"/><line x1="358" y1="180" x2="358" y2="200"/>
          <line x1="380" y1="180" x2="410" y2="180"/><line x1="410" y1="180" x2="410" y2="200"/>
          <line x1="432" y1="180" x2="462" y2="180"/><line x1="462" y1="180" x2="462" y2="200"/>
          <line x1="484" y1="180" x2="514" y2="180"/><line x1="514" y1="180" x2="514" y2="200"/>
          <line x1="536" y1="180" x2="566" y2="180"/><line x1="566" y1="180" x2="566" y2="200"/>
          <line x1="588" y1="180" x2="618" y2="180"/><line x1="618" y1="180" x2="618" y2="200"/>
          <line x1="640" y1="180" x2="670" y2="180"/><line x1="670" y1="180" x2="670" y2="200"/>
        </g>

        <!-- measured overlap lenses: computed from the two circle centres, not eyeballed.
             TWO defects were found and fixed here by measurement (arctest.mjs):
               1. the old fill (#e4e9ec) was the building's own value, so an overlap crossing
                  the roof would have vanished into it;
               2. worse, both arcs originally carried the same sweep flag and therefore selected
                  the SAME circle centre. The two arcs coincided, the path enclosed 0 u^2, and the
                  lens rendered as a bare arc line instead of an area. Measured filled area:
                  L1 0 u^2 -> 1822 u^2 (correct 1876); L2 0 u^2 -> 1388 u^2 (correct 1427).
             The rule tone #c8d0d6 is used because an overlap region must read as a covered AREA
             over both the paper ground and the roof plane, and it is the only mid-tone in the set. -->
        <path d="M403.88 259.54 A150 150 0 0 0 408.12 142.46 A150 150 0 0 0 403.88 259.54 Z" fill="#c8d0d6" stroke="#5b6570" stroke-width="1"/>
        <path d="M685.91 254.59 A150 150 0 0 0 682.09 147.41 A150 150 0 0 0 685.91 254.59 Z" fill="#c8d0d6" stroke="#5b6570" stroke-width="1"/>

        <!-- person route across the roof plane. Drawn AFTER the lenses on purpose: an opaque
             lens painted over the route cut the track exactly where it crosses an overlap,
             which is the one thing this polyline exists to demonstrate. -->
        <polyline points="330,246 405,220 690,214" fill="none" stroke="#5b6570" stroke-width="1.5" stroke-dasharray="2 6" stroke-linecap="round"/>

        <!-- coverage circles: r = 150 units = 75 m, every circle fully on the plate -->
        <circle cx="268" cy="196" r="150" fill="none" stroke="#5b6570" stroke-width="1" stroke-dasharray="4 5"/>
        <circle cx="544" cy="206" r="150" fill="none" stroke="#5b6570" stroke-width="1" stroke-dasharray="4 5"/>
        <circle cx="824" cy="196" r="150" fill="none" stroke="#5b6570" stroke-width="1" stroke-dasharray="4 5"/>

        <!-- radius dimensions -->
        <g stroke="#5b6570" stroke-width="1" stroke-dasharray="3 3">
          <line x1="268" y1="196" x2="118" y2="196"/>
          <line x1="544" y1="206" x2="544" y2="56"/>
          <line x1="824" y1="196" x2="974" y2="196"/>
        </g>

        <!-- mesh links carrying shared detections and reasoning -->
        <g stroke="#5b6570" stroke-width="1.5" stroke-dasharray="6 5">
          <line x1="268" y1="196" x2="544" y2="206"/>
          <line x1="544" y1="206" x2="824" y2="196"/>
        </g>

        <!-- drones -->
        <g stroke="#101820" stroke-width="1.75" fill="none">
          <circle cx="268" cy="196" r="5"/>
          <line x1="254" y1="182" x2="282" y2="210"/><line x1="282" y1="182" x2="254" y2="210"/>
          <circle cx="254" cy="182" r="4.5"/><circle cx="282" cy="182" r="4.5"/><circle cx="254" cy="210" r="4.5"/><circle cx="282" cy="210" r="4.5"/>
        </g>
        <g stroke="#101820" stroke-width="1.75" fill="none">
          <circle cx="544" cy="206" r="5"/>
          <line x1="530" y1="192" x2="558" y2="220"/><line x1="558" y1="192" x2="530" y2="220"/>
          <circle cx="530" cy="192" r="4.5"/><circle cx="558" cy="192" r="4.5"/><circle cx="530" cy="220" r="4.5"/><circle cx="558" cy="220" r="4.5"/>
        </g>
        <g stroke="#101820" stroke-width="1.75" fill="none">
          <circle cx="824" cy="196" r="5"/>
          <line x1="810" y1="182" x2="838" y2="210"/><line x1="838" y1="182" x2="810" y2="210"/>
          <circle cx="810" cy="182" r="4.5"/><circle cx="838" cy="182" r="4.5"/><circle cx="810" cy="210" r="4.5"/><circle cx="838" cy="210" r="4.5"/>
        </g>

        <!-- detection on the roof -->
        <circle cx="405" cy="220" r="5" fill="#c8361a"/>
        <rect x="393" y="208" width="24" height="24" fill="none" stroke="#c8361a" stroke-width="2" class="pulse"/>

        <!-- leader lines -->
        <g stroke="#5b6570" stroke-width="1">
          <line x1="500" y1="148" x2="516" y2="203"/>
          <line x1="688" y1="196" x2="712" y2="148"/>
        </g>

        <!-- scale bar: 2 units = 1 m, so the bar is 100 m -->
        <g stroke="#101820" stroke-width="1.5">
          <line x1="56" y1="384" x2="256" y2="384"/>
          <line x1="56" y1="378" x2="56" y2="390"/>
          <line x1="156" y1="378" x2="156" y2="390"/>
          <line x1="256" y1="378" x2="256" y2="390"/>
        </g>

        <!-- captions -->
        <text x="126" y="184" class="svg-mono">r = 75 m</text>
        <text x="554" y="76" class="svg-mono">r = 75 m</text>
        <text x="880" y="184" class="svg-mono">r = 75 m</text>
        <text x="440" y="140" class="svg-mono">shared track + reasoning</text>
        <text x="706" y="140" class="svg-mono">same track id · both aircraft</text>
        <text x="214" y="246" class="svg-mono">A-01</text>
        <text x="530" y="180" class="svg-mono">A-02</text>
        <text x="830" y="170" class="svg-mono">A-03</text>
        <text x="421" y="252" class="svg-label" fill="#9c2a13">person on the roof</text>
        <text x="421" y="276" class="svg-mono">masked · timestamped</text>
        <text x="328" y="302" class="svg-mono">building · the roof plane is the watch surface</text>
        <text x="56" y="356" class="svg-mono">overlapping coverage · three aircraft · one alert stream</text>
        <text x="640" y="356" class="svg-mono">handover lens · both aircraft share the same pixels</text>
        <text x="56" y="400" class="svg-mono">0</text>
        <text x="148" y="400" class="svg-mono">50 m</text>
        <text x="248" y="400" class="svg-mono">100 m</text>
        <text x="320" y="400" class="svg-mono">drawn to scale · 1 unit = 0.5 m · circles are measured footprints</text>
      </svg>
