[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visionbrain"
version = "0.1.0"
description = "Aerial & camera vision intelligence — on-device AI for drone and CCTV footage"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "VisionBrain contributors"}]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "opencv-python>=4.10",
    "pycocotools>=2.0.8",
    "pycocoa>=25.4",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "supervision>=0.28,<0.30",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.0.0",
    "pytest>=8.0",
]

[project.scripts]
visionbrain = "visionbrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# mlx_vlm and mlx are expected to be pre-installed in the shared poetry venv.
# VisionBrain detects them at runtime and falls back gracefully if missing.
